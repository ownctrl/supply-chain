name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Renovate config
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit digest, per this preset's own policy.
      # A floating tag can be moved onto an attacker's commit.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Pinned so CI does not silently execute whatever renovate publishes next.
      - name: Validate default preset and examples
        env:
          # renovate: datasource=npm depName=renovate
          RENOVATE_VERSION: 44.39.1
        run: |
          npx --yes --package "renovate@${RENOVATE_VERSION}" -- \
            renovate-config-validator --strict default.json examples/*.json
