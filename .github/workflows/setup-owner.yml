name: Setup Owner

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup-owner:
    name: Setup Repository Owner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # Pinned to a commit digest, per this preset's own policy.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get Repository Owner
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER}" >> $GITHUB_OUTPUT

      - name: Update Examples
        env:
          OWNER: ${{ steps.owner.outputs.owner }}
        run: |
          # Point the examples at the new owner's copy of this repo.
          sed -i "s|ownctrl/supply-chain|${OWNER}/supply-chain|g" examples/*.json
          echo "Updated examples to use owner: ${OWNER}"

      - name: Update License
        env:
          OWNER: ${{ steps.owner.outputs.owner }}
        run: |
          YEAR=$(date +%Y)
          # Append new copyright notice
          echo "" >> LICENSE
          echo "Copyright (c) $YEAR $OWNER" >> LICENSE
          echo "Updated LICENSE with new copyright."

      - name: Delete Setup Workflow
        run: |
          rm .github/workflows/setup-owner.yml
          echo "Deleted setup workflow."

      - name: Commit and Push Changes
        env:
          OWNER: ${{ steps.owner.outputs.owner }}
        run: |
          git add examples/ LICENSE .github/workflows/setup-owner.yml
          git commit -m "chore: setup repository owner ($OWNER)"
          git push
